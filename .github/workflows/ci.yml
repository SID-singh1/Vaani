name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check backend tests scripts/dev.py scripts/run_eval_suite.py evaluation
          ruff format --check backend
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vaani:ci .
      - name: Smoke test
        run: |
          docker run -d --name vaani -p 8000:8000 -e APP_ENV=production -e SECRET_KEY=ci-only vaani:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && exit 0; sleep 1; done
          docker logs vaani; exit 1
